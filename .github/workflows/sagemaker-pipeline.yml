name: Pipeline 2 - ML - Train and Register Model v1

on:
  # Retrain after every successful infra deploy.
  # Must match Pipeline 1's `name:` EXACTLY (including "v1").
  workflow_run:
    workflows:
      - "Pipeline 1 - Infra - Create SageMaker Studio v1"
    types:
      - completed
  # Retrain when ML code or data changes
  push:
    branches: [master]
    paths:
      - "pipeline/**"
      - "data/**"
      - "run_pipeline.py"
      - "requirements.txt"
      - ".github/workflows/sagemaker-pipeline.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# A push touching both cdk/ and pipeline/ fires this twice
# (push + workflow_run) — queue runs instead of overlapping them
concurrency:
  group: sagemaker-pipeline
  cancel-in-progress: false

jobs:
  run-sagemaker-pipeline:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run SageMaker Pipeline
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          python run_pipeline.py
